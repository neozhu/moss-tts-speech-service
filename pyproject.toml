[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moss-tts-speech-service"
version = "0.1.0"
description = "OpenAI-compatible FastAPI TTS service powered by MOSS-TTS-Nano (ONNX CPU, Chinese optimized)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.18",
  "numpy>=2.0.0",
  "onnxruntime>=1.20.0",
  "sentencepiece>=0.2.0",
  "huggingface-hub>=0.26.0",
  "soundfile>=0.12.1",
  "scipy>=1.14.0",
  "wetext>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
